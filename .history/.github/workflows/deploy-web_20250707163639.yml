name: Deploy Flutter Web to Supabase

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  deploy-web:
    name: Build and Deploy Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend/appflowy_flutter
        run: flutter pub get

      - name: Enable web platform
        working-directory: frontend/appflowy_flutter
        run: flutter config --enable-web

      - name: Build Flutter Web
        working-directory: frontend/appflowy_flutter
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy to Supabase Storage
        working-directory: frontend/appflowy_flutter
        run: |
          supabase login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          
          # Upload web files to storage bucket
          supabase storage cp -r build/web/ supabase://website/
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy status
        run: |
          echo "🚀 Web app deployed successfully!"
          echo "Visit: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/storage/v1/object/public/website/index.html"
